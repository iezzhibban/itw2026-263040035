<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #F8F8FF;
            text-align: center;
            background-color: #0F172A;
        }

        h1 {
            font-size:40px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: #54668b;
            text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
            color: #38BAF4;
        }

        .quote {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
            

        }

        span{
            color:crimson;
            text-decoration: line-through;

        }

        .credit {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(151 151 151 / 70%);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Cinta</h1>

    <p class="quote">Cinta adalah kekuatan liar. <br> Ketika kita mencoba mengendalikannya, <br>
         ia <span>menghancurkan</span> kita... <br>Ketika kita mencoba untuk memahaminya, <br> ia membuat kita merasa tersesat dan bingung."</p>
         <p class="credit">-Paulo Coelho</p>
</body>
</html>
